name: RL13 reproducibility smoke
on:
  workflow_dispatch:
  push:
    paths: ['experiments/rl13/**', 'docs/showcase/**', 'scripts/audit_showcase.py', '.github/workflows/rl13-smoke.yml']
  pull_request:
    paths: ['experiments/rl13/**', 'docs/showcase/**']
permissions:
  contents: read
concurrency:
  group: rl13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r experiments/rl13/requirements.txt pytest
      - run: python -m pytest experiments/rl13/tests tests/test_dex5_hardware_adapter.py tests/test_canonical_reset_schema.py
      - run: python scripts/audit_showcase.py
